[package]
name = "sol_vault"
version = "2.0.0"
edition = "2021"
description = "SolVault — CLI Solana wallet simulator"

[[bin]]
name = "sol_vault"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
sha2 = "0.10"
rand = "0.8"
colored = "2"
chrono = { version = "0.4", features = ["serde"] }
comfy-table = "7"
dirs-next = "2"
